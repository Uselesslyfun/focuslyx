<!DOCTYPE html>
<html lang="en">
<script src="script.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focuslyx</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Logo -->
    <div class="navbar">
        <img src="LOGOo.JPG" class="logo-img">
    </div>

    <!-- Timer -->
    <div class="top-right">
        <p class="subtitle">Focus session in progress</p>

        <div class="timer" id="timer">00:00</div>

        <div class="controls">
            <button onclick="togglePause()" id="pauseBtn">Pause</button>
        </div>
    </div>

    <!-- Input (bottom right) -->
    <div class="input-box">
        <input type="text" id="noteInput" placeholder="Type and press Enter..." />
    </div>

    <!-- Notes (bottom left) -->
    <div id="notesContainer"></div>

    <script src="script.js"></script>
	
	<div class="shooting-stars">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
</div>

<div class="galaxy"></div>
	
	<!-- PI BUTTON -->
<div class="pi-button" id="piButton">
    π
</div>

<!-- PI MODAL -->
<div class="pi-modal" id="piModal">

    <div class="pi-content">

        <div class="close-btn" id="closePi">
            ✕
        </div>

        <<div class="pi-circle">
    <div class="pi-dot"></div>
</div>

        <h2>First 1000 Digits of π</h2>

        <p class="pi-text">
3.1415926535 8979323846 2643383279 5028841971
6939937510 5820974944 5923078164 0628620899
8628034825 3421170679 8214808651 3282306647
0938446095 5058223172 5359408128
</p>

    </div>

</div>

    </div>

</div>
</body>
</html>
